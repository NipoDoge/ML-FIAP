# ---------------------------------------------------------------------------
# Para subir o ambiente:
#   1. cp .env_example .env   (preencher as variáveis)
#   2. echo "AIRFLOW_UID=$(id -u)" >> .env
#   3. docker compose up --build
#   4. API disponível em:       http://localhost:8000/docs
#   5. Airflow disponível em:   http://localhost:8080  (user: airflow / pass: airflow)
#   6. Logs em tempo real:      http://localhost:8888  (Dozzle)
#   7. Banco via pgAdmin:       http://localhost:5050
#
# Volume ML partilhado (checklist Airflow item 1):
#   - Nome Docker: ml_shared → montado em Airflow em ML_PROJECT_ROOT (/opt/airflow/ml_project)
#     e na API em /var/www/ml_shared (é o mesmo volume).
#   - Datasets: colocar CSV em ./ml_data/uploads/ no host → visível em ambos os serviços:
#       Airflow:  /opt/airflow/ml_project/uploads/<ficheiro>.csv
#       API:      /var/www/ml_shared/uploads/<ficheiro>.csv
#     (bind mount sobre o subdirectório `uploads` do volume ml_shared.)
#   - Saída Baseline/FE no repositório (mesma árvore que ``PATH_*`` na API / .env):
#     ``./src/data/old/<ts>/`` (snapshots baseline + ficheiros pipeline_*.txt),
#     ``./src/data/old/<ts>_fe<id>/`` (logs FE), ``./src/artifacts/models/`` (joblibs + fe_export),
#     ``./src/graphs/``, ``./src/data/pre_processed/``, ``./src/artifacts/reports``,
#     ``./src/artifacts/mlruns`` (MLflow no Airflow alinhado ao layout em src).
#     Estes caminhos são bind mounts **por cima** de ml_shared no Airflow; a API precisa dos
#     mesmos binds em /var/www/ml_shared/... para promote/inferência verem os artefactos
#     (caminhos na BD começam por /opt/airflow/ml_project/ e são remapados em código).
#   - Postgres (db_processing): 3 bases — ``processing``, ``airflow``, ``mlflow``.
#   - MLflow: metadados em Postgres ``mlflow``; artefactos servidos via ``mlflow-artifacts:/``
#     e armazenados em ``/mlflow/artifacts`` (bind ./src/artifacts/mlruns).
#   - API / Airflow / worker: MLFLOW_TRACKING_URI=http://mlflow_server:5000; MLFLOW_ARTIFACT_ROOT=/mlflow/artifacts.
#   - Recomendação (TC02): data/models/reports na raiz do repo montados em ML_PROJECT_ROOT
#     (blocos reco-volumes abaixo). Worker HTTP integrado: worker_recommendation:8010.
#   - MLflow server integrado (recomendação + rubrica TC02): http://localhost:5000
#   - LocalExecutor: scheduler delega reco ao worker (WORKER_RECOMMENDATION_URL).
#   - Build da imagem Airflow inclui deps do projeto (ver docker/airflow.dockerfile); após
#     mudar docker/requirements-api.txt ou o Dockerfile: ``docker compose build airflow-scheduler``
# ---------------------------------------------------------------------------

# Volumes reco (Airflow) — listados inline; alias YAML de lista aninhada quebra o compose.
#   ./data/recommendation → .../data/recommendation
#   ./models/recommendation → .../models/recommendation
#   ./reports/recommendation → .../reports/recommendation
#   ./params.yaml → .../params.yaml:ro

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.dockerfile
  image: processing_airflow:v1
  # Mesmo .env da API — PROJECT_NAME, SECRET, ALGORITHM e caminhos esperados por ``core.configs``.
  env_file:
    - .env
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DATABASE_USER}:${DATABASE_PASS}@db_processing/${AIRFLOW_DATABASE_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Mesma chave em webserver + scheduler: JWT dos URLs de log (porta 8793). Sem isto: 403 / InvalidSignature.
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-airflow-dev-webserver-secret-change-in-prod-min-32chars}
    # Variáveis repassadas aos DAGs para acesso ao projeto ML
    ML_API_URL: http://api_processing:8000
    ML_PROJECT_ROOT: /opt/airflow/ml_project
    # Pasta fixa para CSVs: bind mount ./ml_data/uploads (host) — ver cabeçalho deste ficheiro
    ML_AIRFLOW_UPLOADS_DIR: /opt/airflow/ml_project/uploads
    ML_CODE_ROOT: /opt/airflow/ml_code
    # Pip ``--target`` na imagem (docker/airflow.dockerfile); opcional sobrescrever no compose.
    ML_AIRFLOW_SITE_PACKAGES: /opt/airflow/ml_libs
    # Mesmos PATH_* que rotas manuais (.env): src/data/old, src/artifacts/models, …
    PATH_DATA: /opt/airflow/ml_project/src/data
    PATH_DATA_PREPROCESSED: /opt/airflow/ml_project/src/data/pre_processed
    PATH_MODEL: /opt/airflow/ml_project/src/artifacts/models
    PATH_GRAPHS: /opt/airflow/ml_project/src/graphs
    PATH_LOGS: old
    PATH_MAINTENANCE_REPORTS: /opt/airflow/ml_project/src/artifacts/reports
    MLFLOW_TRACKING_URI: http://mlflow_server:5000
    MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    DATABASE_USER: ${DATABASE_USER}
    DATABASE_PASS: ${DATABASE_PASS}
    DATABASE_SERVER: db_processing
    DATABASE_PORT: ${DATABASE_PORT}
    DATABASE_NAME: ${DATABASE_NAME}
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    # Matplotlib: ~/.cache pode não ser gravável com AIRFLOW_UID no contentor.
    MPLCONFIGDIR: /opt/airflow/ml_project/.matplotlib
    # users.id na app quando Variable/conf omitam ``user_id`` (DAG: DEFAULT_PIPELINE_USER_ID).
    ML_PIPELINE_DEFAULT_USER_ID: "2"
    WORKER_RECOMMENDATION_URL: http://worker_recommendation:8010
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    # Volume nomeado evita Permission denied (UID airflow vs pasta no host)
    - airflow_logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # Volume compartilhado entre API e Airflow (CSVs, logs dos tasks)
    - ml_shared:/opt/airflow/ml_project
    # Datasets no host (opção A): mesma pasta visível na API em /var/www/ml_shared/uploads
    - ./ml_data/uploads:/opt/airflow/ml_project/uploads
    # Árvore ``src/`` como na API local (baseline → data/old, modelos em artifacts/models, …)
    - ./src/data:/opt/airflow/ml_project/src/data
    - ./src/artifacts/models:/opt/airflow/ml_project/src/artifacts/models
    - ./src/graphs:/opt/airflow/ml_project/src/graphs
    - ./src/artifacts/mlruns:/opt/airflow/ml_project/src/artifacts/mlruns
    - ./src/artifacts/mlruns:/mlflow/artifacts
    - ./src/artifacts/reports:/opt/airflow/ml_project/src/artifacts/reports
    # Código Python alinhado ao layout ``src/`` da API (import services, core, …)
    - ./src:/opt/airflow/ml_code:ro
    # Defaults da Variable ml_training_dispatch_conf (airflow-init importa para a BD do Airflow)
    - ./airflow/bootstrap:/opt/airflow/bootstrap:ro
    - ./data/recommendation:/opt/airflow/ml_project/data/recommendation
    - ./models/recommendation:/opt/airflow/ml_project/models/recommendation
    - ./reports/recommendation:/opt/airflow/ml_project/reports/recommendation
    - ./params.yaml:/opt/airflow/ml_project/params.yaml:ro
  depends_on:
    db_processing:
      condition: service_healthy
    worker_recommendation:
      condition: service_healthy
  networks:
    - nwprocessing

services:

  # ---------- Banco de dados PostgreSQL ------------------------------------
  db_processing:
    build:
      dockerfile: ./docker/db.dockerfile
      context: .
    image: processing_database:v1
    container_name: database_processing
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    networks:
      - nwprocessing
    volumes:
      - pgdata:/var/lib/postgresql/data/
      - ./init_db:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- API FastAPI --------------------------------------------------
  # Imagem multi-stage (.dockerignore, Torch CPU): deps listadas em docker/requirements-api.txt.
  api_processing:
    build:
      dockerfile: ./docker/api.dockerfile
      context: .
    image: processing_api:v1
    container_name: api_processing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_SERVER: db_processing
      ML_PROJECT_ROOT: /var/www/ml_shared
      MLFLOW_TRACKING_URI: http://mlflow_server:5000
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
      WORKER_RECOMMENDATION_URL: http://worker_recommendation:8010
    depends_on:
      db_processing:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - nwprocessing
    volumes:
      - api_data:/var/www/src/data
      - api_models:/var/www/src/artifacts/models
      - api_artifacts:/var/www/src/artifacts
      - api_logs:/var/www/logs
      - api_graphs:/var/www/src/graphs
      # Volume compartilhado com Airflow
      - ml_shared:/var/www/ml_shared
      - ./ml_data/uploads:/var/www/ml_shared/uploads
      # Overlays iguais ao bloco Airflow (ficheiros reais estão no host em ./src/..., não só no volume nomeado).
      - ./src/data:/var/www/ml_shared/src/data
      - ./src/artifacts/models:/var/www/ml_shared/src/artifacts/models
      - ./src/graphs:/var/www/ml_shared/src/graphs
      - ./src/artifacts/mlruns:/var/www/ml_shared/src/artifacts/mlruns
      - ./src/artifacts/mlruns:/mlflow/artifacts
      - ./src/artifacts/reports:/var/www/ml_shared/src/artifacts/reports
      - ./data/recommendation:/var/www/ml_shared/data/recommendation
      - ./models/recommendation:/var/www/ml_shared/models/recommendation
      - ./reports/recommendation:/var/www/ml_shared/reports/recommendation
      - ./params.yaml:/var/www/ml_shared/params.yaml:ro

  # ---------- MLflow (recomendação / TC02 integrado) ------------------------
  mlflow_server:
    build:
      context: .
      dockerfile: docker/mlflow.dockerfile
    image: processing_mlflow:v1
    container_name: mlflow_server
    restart: unless-stopped
    depends_on:
      db_processing:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${DATABASE_USER}:${DATABASE_PASS}@db_processing:5432/${MLFLOW_DATABASE_NAME:-mlflow}
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow_server,mlflow_server:5000
    ports:
      - "5000:5000"
    volumes:
      - ./src/artifacts/mlruns:/mlflow/artifacts
    networks:
      - nwprocessing

  # ---------- Worker recomendação (treino HTTP + persist BD) ---------------
  worker_recommendation:
    build:
      context: .
      dockerfile: docker/worker-recommendation.dockerfile
    image: processing_worker_reco:v1
    container_name: worker_recommendation
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_SERVER: db_processing
      ML_PROJECT_ROOT: /var/www/ml_shared
      MLFLOW_TRACKING_URI: http://mlflow_server:5000
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    depends_on:
      db_processing:
        condition: service_healthy
      mlflow_server:
        condition: service_started
    ports:
      - "8010:8010"
    networks:
      - nwprocessing
    volumes:
      - ml_shared:/var/www/ml_shared
      - ./ml_data/uploads:/var/www/ml_shared/uploads
      - ./src/data:/var/www/ml_shared/src/data
      - ./src/artifacts/models:/var/www/ml_shared/src/artifacts/models
      - ./src/graphs:/var/www/ml_shared/src/graphs
      - ./src/artifacts/mlruns:/var/www/ml_shared/src/artifacts/mlruns
      - ./src/artifacts/mlruns:/mlflow/artifacts
      - ./src/artifacts/reports:/var/www/ml_shared/src/artifacts/reports
      - ./data/recommendation:/var/www/ml_shared/data/recommendation
      - ./models/recommendation:/var/www/ml_shared/models/recommendation
      - ./reports/recommendation:/var/www/ml_shared/reports/recommendation
      - ./params.yaml:/var/www/ml_shared/params.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- pgAdmin (interface web para o banco) -------------------------
  pgadmin:
    build:
      dockerfile: ./docker/pgadmin.dockerfile
      context: .
    image: pgadmin_db:v1
    container_name: pgadmin_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    ports:
      - "5050:80"
    depends_on:
      db_processing:
        condition: service_healthy
    networks:
      - nwprocessing

  # ---------- Dozzle (visualizador de logs dos containers) -----------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle_logs
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nwprocessing

  # ---------- Airflow — inicialização (roda uma vez e encerra) -------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs/scheduler /opt/airflow/logs/dag_processor
        mkdir -p /opt/airflow/ml_project/uploads \
          /opt/airflow/ml_project/src/data/old \
          /opt/airflow/ml_project/src/data/pre_processed \
          /opt/airflow/ml_project/src/artifacts/models \
          /opt/airflow/ml_project/src/artifacts/mlruns \
          /opt/airflow/ml_project/src/artifacts/reports \
          /opt/airflow/ml_project/src/graphs \
          /opt/airflow/ml_project/.matplotlib
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        # Não fazer chown recursivo em ml_project inteiro — params.yaml está montado :ro.
        for path in \
          /opt/airflow/ml_project/uploads \
          /opt/airflow/ml_project/src \
          /opt/airflow/ml_project/data \
          /opt/airflow/ml_project/models \
          /opt/airflow/ml_project/reports \
          /opt/airflow/ml_project/.matplotlib; do
          if [[ -e "$$path" ]]; then
            chown -R "${AIRFLOW_UID:-50000}:0" "$$path"
          fi
        done
        exec /entrypoint bash -c '
          airflow db migrate
          airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com || true
          bash /opt/airflow/bootstrap/init-airflow-vars.sh
        '
    restart: "no"

  # ---------- Airflow — scheduler ------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Airflow — webserver ------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

# ---------------------------------------------------------------------------
networks:
  nwprocessing:
    name: "nwprocessing"
    driver: "bridge"

volumes:
  pgdata:
  api_data:
  api_models:
  api_artifacts:
  api_logs:
  api_graphs:
  ml_shared:
  airflow_logs:
