[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "api", from = "src" },
  { include = "core", from = "src" },
  { include = "domains", from = "src" },
  { include = "domains_ring", from = "src" },
  { include = "executors_ring", from = "src" },
  { include = "infra_ring", from = "src" },
  { include = "ml_core_ring", from = "src" },
  { include = "models", from = "src" },
  { include = "orchestration_ring", from = "src" },
  { include = "platform_ring", from = "src" },
  { include = "schemas", from = "src" },
  { include = "services", from = "src" },
]

