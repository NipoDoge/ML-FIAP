# Optional: dev/test dependencies
[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
  "pyyaml>=6.0",
  "pre-commit>=3.0.0",
]

tc02 = [
  "dvc>=3.0.0",
  "pyyaml>=6.0",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
pytest-asyncio = ">=0.21.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
pre-commit = ">=3.0.0"

[tool.poetry.group.tc02.dependencies]
dvc = ">=3.0.0"

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
  "smoke: smoke tests",
  "integration: integration tests",
  "unit: unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
  "*/tests/*",
  "*/venv/*",
  "setup.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# Ruff (lint + format opcional; alinhado a requires-python >= 3.10)
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  "*.egg-info",
  "htmlcov",
]

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
# Bootstraps/shims que precisam preparar `sys.path` ou emitir aviso antes dos imports.
"airflow/dags/ml_training_dispatch.py" = ["E402"]
"main.py" = ["E402"]
"scripts/ml/promote_registry.py" = ["E402"]
"src/core/ml/__init__.py" = ["E402"]
"worker_recommendation.py" = ["E402"]
